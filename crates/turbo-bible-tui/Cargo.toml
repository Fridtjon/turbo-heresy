[package]
name = "turbo-heresy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Turbo Vision–styled terminal grimoire reader with FTS5 search."
license.workspace = true
homepage.workspace = true
readme = "../../README.md"
repository.workspace = true
keywords = ["grimoire", "tui", "ratatui", "terminal", "turbo-vision"]
categories = ["command-line-utilities", "text-processing"]
build = "build.rs"

# All three scriptures are embedded (Paradise Lost ~0.8 MB zstd, plus
# Liber AL vel Legis and the hand-written Unholy Writ). There is no
# runtime fetch — everything ships in the binary.
include = [
    "src/**/*",
    "build.rs",
    "assets/en-plost.db.zst",
    "assets/en-liber-al.db.zst",
    "assets/en-unholy.db.zst",
    "assets/manifest.json",
    "Cargo.toml",
    # Copied in by release.yml's `publish-crate` job from workspace
    # root before `cargo publish` runs. crates.io tarball needs its
    # own LICENSE copies for compliance with "MIT OR Apache-2.0".
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
arboard = "3"
clap.workspace = true
crossterm = "0.29"
etcetera = "0.11"
ratatui = "0.30"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec = "1"
tempfile.workspace = true
time.workspace = true
toml.workspace = true
zstd.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = "1"
rexpect = "0.7"
